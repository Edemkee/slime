name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tooling tests
        run: bash tests/test_tag_release.sh
      - name: Reference simulation invariant
        run: python3 tools/reference_sim.py --check
